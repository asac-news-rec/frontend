services:
  web:
    build:
      context: .
      target: local-nginx
    ports:
      - "127.0.0.1:${NEWS_PORT:-8080}:80"
    environment:
      FASTAPI_UPSTREAM: ${FASTAPI_UPSTREAM:-host.docker.internal:8000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3

# Retain the old volume declaration; existing data is neither mounted nor deleted.
volumes:
  visitor-data:
