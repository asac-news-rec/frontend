services:
  web:
    build: .
    ports:
      - "127.0.0.1:${NEWS_PORT:-4181}:4173"
    environment:
      PUBLIC_ORIGIN: "http://127.0.0.1:${NEWS_PORT:-4181}"
      NEWS_BACKEND_URL: ${NEWS_BACKEND_URL:-}
    volumes:
      - visitor-data:/app/data
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/api/v1/visitors/me').then(r=>process.exit([200,401].includes(r.status)?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  visitor-data:
