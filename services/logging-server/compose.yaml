services:
  logging:
    build: .
    ports:
      - "127.0.0.1:${LOGGING_PORT:-4195}:4195"
    environment:
      LOGGING_TOKEN: "${LOGGING_TOKEN:?Set LOGGING_TOKEN}"
      LOGGING_STORE: postgres
      LOGGING_DATABASE_URL: "${LOGGING_DATABASE_URL:?Set PostgreSQL URL}"
      GCS_BUCKET: "${GCS_BUCKET:?Set raw logs bucket}"
      GOOGLE_CLOUD_PROJECT: "${GOOGLE_CLOUD_PROJECT:?Set GCP project}"
      GCS_PREFIX: "${GCS_PREFIX:-}"
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4195/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
  worker:
    build: .
    command: ["python", "-m", "logging_service.worker"]
    environment:
      LOGGING_TOKEN: "${LOGGING_TOKEN:?Set LOGGING_TOKEN}"
      LOGGING_STORE: postgres
      LOGGING_DATABASE_URL: "${LOGGING_DATABASE_URL:?Set PostgreSQL URL}"
      GCS_BUCKET: "${GCS_BUCKET:?Set raw logs bucket}"
      GOOGLE_CLOUD_PROJECT: "${GOOGLE_CLOUD_PROJECT:?Set GCP project}"
      GCS_PREFIX: "${GCS_PREFIX:-}"
      LOGGING_FLUSH_MS: "${LOGGING_FLUSH_MS:-30000}"
    init: true
    restart: unless-stopped
