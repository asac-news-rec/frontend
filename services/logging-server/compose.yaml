services:
  logging:
    build: .
    ports:
      - "127.0.0.1:${LOGGING_PORT:-4195}:4195"
    environment:
      LOGGING_TOKEN: "${LOGGING_TOKEN:?Set LOGGING_TOKEN}"
    volumes:
      - logging-data:/service/data
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4195/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
volumes:
  logging-data:
