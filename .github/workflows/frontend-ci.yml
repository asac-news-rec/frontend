name: Frontend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Verify the production image
        run: |
          docker build --target production -t news-web:ci .
          bash scripts/smoke-cloud-run.sh news-web:ci
      - name: Verify opt-in behavior gateway images
        run: |
          docker build --target behavior-proxy -t news-behavior-proxy:ci .
          docker build --target production-behavior -t news-web-behavior:ci .
          bash scripts/smoke-behavior-gateway.sh news-web-behavior:ci news-behavior-proxy:ci
      - name: Upload deployment files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: dist/
          retention-days: 90
          if-no-files-found: error

  deploy:
    name: Deploy the frontend to Cloud Run
    needs: verify
    if: github.ref == 'refs/heads/main' && vars.FRONTEND_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: frontend-production
    concurrency:
      group: news-feed-frontend
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      NEWS_WEB_IMAGE: ${{ vars.NEWS_WEB_IMAGE }}
      FRONTEND_BEHAVIOR_ENABLED: ${{ vars.FRONTEND_BEHAVIOR_ENABLED }}
      BEHAVIOR_PROXY_IMAGE: ${{ vars.BEHAVIOR_PROXY_IMAGE }}
      GCP_PROJECT: ${{ vars.GCP_PROJECT }}
      RUN_REGION: ${{ vars.RUN_REGION }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build and verify the release image
        run: |
          set -euo pipefail
          : "${NEWS_WEB_IMAGE:?Set NEWS_WEB_IMAGE}" "${GCP_PROJECT:?Set GCP_PROJECT}" "${RUN_REGION:?Set RUN_REGION}"
          image="${NEWS_WEB_IMAGE}:$GITHUB_SHA"
          if [[ "$FRONTEND_BEHAVIOR_ENABLED" == 'true' ]]; then
            : "${BEHAVIOR_PROXY_IMAGE:?Set BEHAVIOR_PROXY_IMAGE}"
            gateway_image="${BEHAVIOR_PROXY_IMAGE}:$GITHUB_SHA"
            docker build --platform linux/amd64 --target behavior-proxy --tag "$gateway_image" .
            docker build --platform linux/amd64 --target production-behavior --tag "$image" .
            bash scripts/smoke-behavior-gateway.sh "$image" "$gateway_image"
            echo "GATEWAY_IMAGE=$gateway_image" >> "$GITHUB_ENV"
          else
            docker build --platform linux/amd64 --target production --tag "$image" .
            bash scripts/smoke-cloud-run.sh "$image"
          fi
          echo "IMAGE=$image" >> "$GITHUB_ENV"
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Publish and update the configured frontend containers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$FRONTEND_BEHAVIOR_ENABLED" == 'true' ]]; then
            # Initial sidecar/Secrets/IAM setup belongs to infrastructure.
            gcloud run services describe news-feed --project "$GCP_PROJECT" --region "$RUN_REGION" \
              --format=json > "$RUNNER_TEMP/news-feed.json"
            python3 - "$RUNNER_TEMP/news-feed.json" <<'PYCODE'
          import json, sys
          with open(sys.argv[1]) as source:
              containers = json.load(source)["spec"]["template"]["spec"]["containers"]
          if "behavior-proxy" not in {item["name"] for item in containers}:
              raise SystemExit("Infrastructure must create the behavior-proxy sidecar first")
          PYCODE
            gcloud auth configure-docker "${BEHAVIOR_PROXY_IMAGE%%/*}" --quiet
            docker push "$GATEWAY_IMAGE"
          fi
          gcloud auth configure-docker "${NEWS_WEB_IMAGE%%/*}" --quiet
          docker push "$IMAGE"
          if [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" != "$GITHUB_SHA" ]]; then
            echo 'A newer main commit exists. Skipping Cloud Run deployment.'
            exit 0
          fi
          if [[ "$FRONTEND_BEHAVIOR_ENABLED" == 'true' ]]; then
            gcloud --quiet run services update news-feed --project "$GCP_PROJECT" --region "$RUN_REGION" \
              --container nginx --image "$IMAGE" --container behavior-proxy --image "$GATEWAY_IMAGE"
          else
            gcloud --quiet run services update news-feed --project "$GCP_PROJECT" --region "$RUN_REGION" \
              --container nginx --image "$IMAGE"
          fi
