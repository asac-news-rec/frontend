name: Notify Slack when a PR is ready

on:
  pull_request_target:
    branches: [main]
    types: [opened, ready_for_review]

permissions: {}

jobs:
  notify:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # Use the trusted base workflow without checking out or running PR code.
      - name: Send review request
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_PR_WEBHOOK_URL }}
        run: |
          if [[ -z "$SLACK_WEBHOOK_URL" ]]; then
            echo "::notice::SLACK_PR_WEBHOOK_URL is not configured."
            exit 0
          fi
          jq '{text: ("리뷰 요청 · PR #" + (.pull_request.number | tostring)), blocks: [{type: "section", text: {type: "plain_text", text: ("리뷰 요청 · " + .pull_request.title + "\n작성자: " + .pull_request.user.login + "\n" + .pull_request.html_url)}}]}' "$GITHUB_EVENT_PATH" |
            curl --fail --silent --show-error --max-time 20 --header 'Content-Type: application/json' --data-binary @- "$SLACK_WEBHOOK_URL"
