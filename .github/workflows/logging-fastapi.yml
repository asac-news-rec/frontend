name: FastAPI logging
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: logging-fastapi-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      browser: ${{ steps.scope.outputs.browser }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: scope
        run: node scripts/ci-browser-scope.mjs
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha }}
          CI_HEAD: ${{ github.event.pull_request.head.sha }}

  integration:
    name: Logging integration
    timeout-minutes: 8
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: logging
          POSTGRES_PASSWORD: ci-integration-only
          POSTGRES_DB: logging
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U logging -d logging"
          --health-interval 3s --health-timeout 3s --health-retries 20
      gcs:
        image: fsouza/fake-gcs-server:1.54
        env:
          FAKE_GCS_SCHEME: http
          FAKE_GCS_EXTERNAL_URL: http://127.0.0.1:4443
        ports: ['4443:4443']
    env:
      TEST_POSTGRES_URL: postgresql://logging:ci-integration-only@127.0.0.1:5432/logging
      STORAGE_EMULATOR_HOST: http://127.0.0.1:4443
    defaults:
      run:
        working-directory: services/logging-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q logging_service
      - run: python -m pytest python_tests -q
      - run: node --test ../../tests/integration/fastapi-logging.test.mjs

  browser:
    name: Browser regression
    needs: scope
    if: needs.scope.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: logging
          POSTGRES_PASSWORD: ci-integration-only
          POSTGRES_DB: logging
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U logging -d logging"
          --health-interval 3s --health-timeout 3s --health-retries 20
      gcs:
        image: fsouza/fake-gcs-server:1.54
        env:
          FAKE_GCS_SCHEME: http
          FAKE_GCS_EXTERNAL_URL: http://127.0.0.1:4443
        ports: ['4443:4443']
    env:
      TEST_POSTGRES_URL: postgresql://logging:ci-integration-only@127.0.0.1:5432/logging
      STORAGE_EMULATOR_HOST: http://127.0.0.1:4443
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r services/logging-server/requirements-dev.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:local
      - run: node --test --test-timeout=120000 tests/browser/*.test.mjs

  test:
    name: test
    needs: [scope, integration, browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every applicable check
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          BROWSER_REQUIRED: ${{ needs.scope.outputs.browser }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$SCOPE_RESULT" = success
          test "$INTEGRATION_RESULT" = success
          if [ "$BROWSER_REQUIRED" = true ]; then
            test "$BROWSER_RESULT" = success
          else
            test "$BROWSER_RESULT" = skipped
          fi

  deploy:
    name: Deploy logging FastAPI to Cloud Run
    needs: test
    if: github.ref == 'refs/heads/main' && vars.LOGGING_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: logging-production
    permissions:
      contents: read
      id-token: write
    env:
      LOGGING_IMAGE: ${{ vars.LOGGING_IMAGE }}
      GCP_PROJECT: ${{ vars.GCP_PROJECT }}
      RUN_REGION: ${{ vars.RUN_REGION }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build the verified release image
        run: |
          set -euo pipefail
          : "${LOGGING_IMAGE:?Set LOGGING_IMAGE}" "${GCP_PROJECT:?Set GCP_PROJECT}" "${RUN_REGION:?Set RUN_REGION}"
          image="${LOGGING_IMAGE}:$GITHUB_SHA"
          docker build --platform linux/amd64 --tag "$image" services/logging-server
          echo "IMAGE=$image" >> "$GITHUB_ENV"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Publish and update the existing logging service
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gcloud run services describe logging-server --project "$GCP_PROJECT" --region "$RUN_REGION" >/dev/null
          gcloud auth configure-docker "${LOGGING_IMAGE%%/*}" --quiet
          docker push "$IMAGE"
          if [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" != "$GITHUB_SHA" ]]; then
            echo 'A newer main commit exists. Skipping Cloud Run deployment.'
            exit 0
          fi
          gcloud --quiet run services update logging-server --project "$GCP_PROJECT" --region "$RUN_REGION" \
            --image "$IMAGE"
