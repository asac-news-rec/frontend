name: FastAPI logging
on:
  pull_request:
    paths:
      - 'services/logging-server/**'
      - 'tests/integration/**'
      - 'tests/helpers/**'
      - 'scripts/synthetic-logging-agent.mjs'
      - 'src/**'
      - 'server/**'
      - 'tests/browser/**'
      - '.github/workflows/logging-fastapi.yml'
  push:
    branches: [main]
    paths: ['services/logging-server/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: logging
          POSTGRES_PASSWORD: ci-integration-only
          POSTGRES_DB: logging
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U logging -d logging"
          --health-interval 3s --health-timeout 3s --health-retries 20
      gcs:
        image: fsouza/fake-gcs-server:1.54
        env:
          FAKE_GCS_SCHEME: http
          FAKE_GCS_EXTERNAL_URL: http://127.0.0.1:4443
        ports: ['4443:4443']
    env:
      TEST_POSTGRES_URL: postgresql://logging:ci-integration-only@127.0.0.1:5432/logging
      STORAGE_EMULATOR_HOST: http://127.0.0.1:4443
    defaults:
      run:
        working-directory: services/logging-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q logging_service
      - run: python -m pytest python_tests -q
      - run: node --test ../../tests/integration/fastapi-logging.test.mjs
      - run: npm ci
        working-directory: .
      - run: npx playwright install --with-deps chromium
        working-directory: .
      - run: npm run test:browser
        working-directory: .
