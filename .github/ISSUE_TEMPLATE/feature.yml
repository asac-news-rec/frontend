name: Feature
description: 화면, 피드, 방문자 기능, 행동 수집 또는 협업 설정을 제안합니다.
title: "[FEAT] "
labels: ["feature"]
body:
  - type: textarea
    id: purpose
    attributes:
      label: 목적
      description: 누구의 어떤 문제를 해결하는지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: 영향받는 컴포넌트
      multiple: true
      options:
        - 화면과 접근성
        - 샘플 피드
        - 방문자 API와 저장
        - 좋아요
        - 행동 이벤트 수집
        - 백엔드 API 계약
        - Docker Compose
        - GitHub Actions와 협업 설정
        - 문서와 계약
        - 기타
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: 실제 입력과 출력으로 확인할 기준을 적어 주세요.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 참고 사항
      description: 신규 독자 처리, 추천 근거, 데이터 출처와 개인정보 영향이 있으면 적어 주세요.
    validations:
      required: false
