name: Bug
description: 화면, 프론트엔드 API, 방문자, 좋아요 또는 행동 수집 오류를 보고합니다.
title: "[BUG] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 현상
      description: 관찰한 문제를 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      description: 다시 확인할 수 있는 절차를 적어 주세요.
      placeholder: |
        1. 화면을 엽니다.
        2. 동작을 수행합니다.
        3. 결과를 확인합니다.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: 영향받는 컴포넌트
      multiple: true
      options:
        - 화면과 접근성
        - 샘플 피드
        - 방문자 API와 저장
        - 좋아요
        - 행동 이벤트 수집
        - Docker Compose
        - GitHub Actions와 협업 설정
        - 문서와 계약
        - 기타
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 실행 환경
      description: 브랜치, Node 버전, 브라우저, 로컬 또는 Docker 환경을 적어 주세요.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: 오류 메시지
      description: 쿠키, 토큰, 개인 식별 정보를 제거한 로그만 적어 주세요.
      render: shell
    validations:
      required: false
