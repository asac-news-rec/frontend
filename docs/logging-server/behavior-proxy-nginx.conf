# Include inside the static frontend's server {} block.
# behavior-proxy is the Node gateway from Dockerfile --target behavior-proxy.
# Set PUBLIC_ORIGIN to the browser origin; retain the original Origin header.
# NEWS_BACKEND_URL must point at a different backend API gateway, never this route.
location ^~ /api/behavior/ {
    proxy_pass http://behavior-proxy:4173;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header Cookie $http_cookie;
    client_max_body_size 256k;
}
location = /api/news/feed {
    proxy_pass http://behavior-proxy:4173;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header Cookie $http_cookie;
    client_max_body_size 256k;
}
location = /api/user/anonymous {
    proxy_pass http://behavior-proxy:4173;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header Cookie $http_cookie;
    client_max_body_size 1k;
}
