# Example server block for the backend owner's existing Nginx configuration.
# Replace server_name, root and upstream address before deploying.
server {
    listen 80;
    server_name news.example.com;
    root /usr/share/nginx/html/news;
    index index.html;

    # Trailing slash removes /api/v1/backend/ from the upstream URL.
    location /api/v1/backend/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 8s;
        proxy_read_timeout 8s;
        client_max_body_size 256k;
        add_header Cache-Control "private, no-store" always;
    }

    # Do not expose the previous sample/visitor APIs.
    location /api/ { return 404; }
    location = / { add_header Cache-Control "no-cache"; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location /src/ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }
    location / { return 404; }
}
